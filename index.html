<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>4C 課堂加分站</title>
  <style>
    :root{--navy:#173b67;--sky:#eaf5ff;--green:#42a66b;--red:#db5d61;--ink:#1e2b3a;--muted:#6c7b8d;--line:#dce5ef}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:linear-gradient(135deg,#edf7ff,#fff9e7);color:var(--ink)}button,input{font:inherit}button{cursor:pointer}.app{max-width:1440px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:18px}.title h1{margin:0;color:var(--navy);font-size:clamp(28px,4vw,48px)}.title p{margin:5px 0 0;color:var(--muted)}.summary{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.chip{background:#fff;border:1px solid var(--line);padding:10px 14px;border-radius:999px;font-weight:700;box-shadow:0 4px 14px #173b6710}.teacher-btn{border:0;background:var(--navy);color:#fff;padding:11px 16px;border-radius:999px;font-weight:800}.tabs{display:flex;gap:8px;margin:14px 0 18px}.tab{border:0;border-radius:12px;padding:12px 18px;background:#dce9f6;color:var(--navy);font-weight:800}.tab.active{background:var(--navy);color:#fff}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.toolbar input{width:min(360px,100%);padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff}.ghost{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;color:var(--muted)}.notice{display:none;margin:0 0 14px;padding:11px 14px;border-radius:12px;background:#fff3cd;color:#765d00}.notice.show{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 8px 24px #173b6712}.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.num{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--sky);color:var(--navy);font-weight:900}.name{flex:1}.name strong{display:block;font-size:19px}.name small{display:block;color:var(--muted);margin-top:3px;line-height:1.25}.score{font-size:36px;font-weight:900;color:var(--navy);min-width:50px;text-align:right}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:14px}.controls button{border:0;border-radius:10px;padding:10px 4px;font-weight:900}.plus{background:#e5f7eb;color:#187845}.minus{background:#ffe9e9;color:#a83137}.panel{display:none}.panel.active{display:block}.log{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}.log-row{display:grid;grid-template-columns:110px 1fr 90px;gap:10px;padding:12px 15px;border-bottom:1px solid var(--line)}.log-row:last-child{border:0}.delta{font-weight:900;text-align:right}.positive{color:var(--green)}.negative{color:var(--red)}.empty{padding:35px;text-align:center;color:var(--muted)}footer{margin-top:22px;text-align:center;color:var(--muted);font-size:13px}.danger{color:#a83137;border-color:#efc8ca}.teacher-only{display:none}.teacher-mode .teacher-only{display:grid}.modal{position:fixed;inset:0;background:#173b6788;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.show{display:flex}.dialog{width:min(420px,100%);background:#fff;border-radius:20px;padding:24px;box-shadow:0 22px 60px #0003}.dialog h2{margin:0 0 8px;color:var(--navy)}.dialog p{margin:0 0 16px;color:var(--muted)}.dialog input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px}.dialog-actions{display:flex;gap:10px;justify-content:flex-end}.dialog-actions button{border:0;border-radius:10px;padding:11px 15px;font-weight:800}.primary{background:var(--navy);color:#fff}.login-error{min-height:22px;color:var(--red);font-size:14px}@media(max-width:650px){.app{padding:14px}header{align-items:flex-start;flex-direction:column}.toolbar{align-items:stretch;flex-direction:column}.tabs{overflow:auto}.log-row{grid-template-columns:80px 1fr 55px}.controls{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
<main class="app" id="app">
  <header><div class="title"><h1>4C 課堂加分站</h1><p>記錄每位同學的努力與進步</p></div><div class="summary"><span class="chip" id="modeChip">學生瀏覽模式</span><span class="chip" id="classTotal">全班總分 0</span><button class="teacher-btn" id="teacherButton">老師登入</button></div></header>
  <div class="notice" id="notice"></div>
  <nav class="tabs"><button class="tab active" data-panel="students">個人分數</button><button class="tab" data-panel="ranking">排行榜</button><button class="tab" data-panel="history">變動紀錄</button></nav>
  <section class="panel active" id="students"><div class="toolbar"><input id="search" placeholder="搜尋學號、中文或英文姓名"><button class="ghost" id="sortStudent">按分數排序</button></div><div class="grid" id="studentGrid"></div></section>
  <section class="panel" id="ranking"><div class="grid" id="rankingGrid"></div></section>
  <section class="panel" id="history"><div class="toolbar"><strong>最近50次分數變動</strong><button class="ghost danger teacher-only" id="reset">重設所有分數</button></div><div class="log" id="log"></div></section>
  <footer>分數已連接雲端，所有裝置會自動同步。學生只可查看，老師登入後才可修改。</footer>
</main>
<div class="modal" id="loginModal" role="dialog" aria-modal="true"><form class="dialog" id="loginForm"><h2>老師登入</h2><p>輸入教師 PIN 才可加分或扣分。</p><input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="教師 PIN" required><div class="login-error" id="loginError"></div><div class="dialog-actions"><button type="button" class="ghost" id="cancelLogin">取消</button><button type="submit" class="primary" id="loginSubmit">登入</button></div></form></div>
<script>
const SUPABASE_URL='https://efvdorfrzelwdpckjtan.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVmdmRvcmZyemVsd2RwY2tqdGFuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxMTc2NjksImV4cCI6MjEwNTY5MzY2OX0.KD-oK8e6X9vGMKEbAlNXMkfU3P19a0t2MmchzUZ2y-Q';
const TEACHER_EMAIL='teacher@4cclasspoints.app';
let students=[],history=[],scoreSort=false,session=JSON.parse(sessionStorage.getItem('4c-teacher-session')||'null');
const apiHeaders=(auth=false)=>({'apikey':SUPABASE_KEY,'Authorization':`Bearer ${auth&&session?session.access_token:SUPABASE_KEY}`,'Content-Type':'application/json'});
const esc=s=>String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const showNotice=(message,isError=false)=>{notice.textContent=message;notice.style.background=isError?'#ffe9e9':'#fff3cd';notice.style.color=isError?'#8f252b':'#765d00';notice.classList.toggle('show',!!message)};
const isTeacher=()=>!!session?.access_token;
async function request(path,options={}){const res=await fetch(`${SUPABASE_URL}${path}`,options);if(!res.ok){let message=`連線失敗 (${res.status})`;try{const body=await res.json();message=body.msg||body.message||body.error_description||message}catch{}throw new Error(message)}if(res.status===204)return null;const text=await res.text();return text?JSON.parse(text):null}
async function loadData(silent=false){try{const [studentData,eventData]=await Promise.all([request('/rest/v1/students?select=id,chinese_name,english_name,score&order=id.asc',{headers:apiHeaders()}),request('/rest/v1/score_events?select=id,student_id,delta,created_at&order=created_at.desc&limit=50',{headers:apiHeaders()})]);students=studentData||[];history=eventData||[];if(!silent)showNotice('');render()}catch(err){if(!silent)showNotice(`未能載入雲端分數：${err.message}`,true)}}
async function changeScore(id,delta){if(!isTeacher())return openLogin();setBusy(true);try{await request('/rest/v1/rpc/change_score',{method:'POST',headers:apiHeaders(true),body:JSON.stringify({p_student_id:id,p_delta:delta})});await loadData()}catch(err){if(err.message.includes('JWT')||err.message.includes('Teacher')){logout();openLogin()}else showNotice(`未能更新分數：${err.message}`,true)}finally{setBusy(false)}}
async function resetScores(){if(!isTeacher())return;if(!confirm('確定要清除所有個人分數和紀錄嗎？'))return;setBusy(true);try{await request('/rest/v1/rpc/reset_all_scores',{method:'POST',headers:apiHeaders(true),body:'{}'});await loadData()}catch(err){showNotice(`未能重設分數：${err.message}`,true)}finally{setBusy(false)}}
function setBusy(b){document.querySelectorAll('.controls button,#reset').forEach(x=>x.disabled=b)}
function renderStudents(){const q=search.value.trim().toLowerCase();let list=students.filter(s=>`${s.id} ${s.chinese_name} ${s.english_name}`.toLowerCase().includes(q));if(scoreSort)list.sort((a,b)=>b.score-a.score||a.id-b.id);studentGrid.innerHTML=list.map(s=>`<article class="card"><div class="card-top"><span class="num">${s.id}</span><div class="name"><strong>${esc(s.chinese_name)}</strong><small>${esc(s.english_name)}</small></div><span class="score">${s.score}</span></div><div class="controls teacher-only"><button class="plus" onclick="changeScore(${s.id},1)">+1</button><button class="plus" onclick="changeScore(${s.id},5)">+5</button><button class="minus" onclick="changeScore(${s.id},-1)">−1</button><button class="minus" onclick="changeScore(${s.id},-5)">−5</button></div></article>`).join('')}
function renderRanking(){const top=[...students].sort((a,b)=>b.score-a.score||a.id-b.id).slice(0,10);rankingGrid.innerHTML=`<article class="card"><h2>個人龍虎榜</h2>${top.map((s,i)=>`<div class="log-row"><b>${i+1}</b><span>${s.id}. ${esc(s.chinese_name)}</span><b class="delta positive">${s.score}</b></div>`).join('')}</article>`}
function renderLog(){const byId=Object.fromEntries(students.map(s=>[s.id,s]));log.innerHTML=history.length?history.map(x=>{const s=byId[x.student_id];const t=new Date(x.created_at).toLocaleString('zh-HK',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});return `<div class="log-row"><span>${t}</span><span>${s?esc(s.chinese_name):`學號 ${x.student_id}`}</span><span class="delta ${x.delta>=0?'positive':'negative'}">${x.delta>=0?'+':''}${x.delta}</span></div>`}).join(''):'<div class="empty">暫時未有分數變動</div>'}
function render(){app.classList.toggle('teacher-mode',isTeacher());modeChip.textContent=isTeacher()?'老師管理模式':'學生瀏覽模式';teacherButton.textContent=isTeacher()?'老師登出':'老師登入';renderStudents();renderRanking();renderLog();classTotal.textContent=`全班總分 ${students.reduce((a,s)=>a+s.score,0)}`}
function openLogin(){loginError.textContent='';pin.value='';loginModal.classList.add('show');setTimeout(()=>pin.focus(),50)}function closeLogin(){loginModal.classList.remove('show')}
async function login(e){e.preventDefault();loginSubmit.disabled=true;loginError.textContent='';try{const data=await request('/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:TEACHER_EMAIL,password:pin.value})});session=data;sessionStorage.setItem('4c-teacher-session',JSON.stringify(data));closeLogin();showNotice('老師登入成功');render()}catch{loginError.textContent='PIN 不正確，請重新輸入。'}finally{loginSubmit.disabled=false}}
function logout(){session=null;sessionStorage.removeItem('4c-teacher-session');showNotice('已登出老師管理模式');render()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.panel).classList.add('active')});search.oninput=renderStudents;sortStudent.onclick=()=>{scoreSort=!scoreSort;sortStudent.textContent=scoreSort?'按學號排序':'按分數排序';renderStudents()};reset.onclick=resetScores;teacherButton.onclick=()=>isTeacher()?logout():openLogin();loginForm.onsubmit=login;cancelLogin.onclick=closeLogin;loginModal.onclick=e=>{if(e.target===loginModal)closeLogin()};render();loadData();setInterval(()=>loadData(true),5000);
</script>
</body></html>
