<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>4C 課堂加分站</title>
  <style>
    :root{--navy:#173b67;--blue:#2d76d2;--sky:#eaf5ff;--yellow:#ffd76a;--green:#42a66b;--red:#db5d61;--ink:#1e2b3a;--muted:#6c7b8d;--line:#dce5ef;--white:#fff}
    *{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:linear-gradient(135deg,#edf7ff,#fff9e7);color:var(--ink)}
    button,input{font:inherit} button{cursor:pointer} .app{max-width:1440px;margin:auto;padding:24px}
    header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:18px}.title h1{margin:0;color:var(--navy);font-size:clamp(28px,4vw,48px)}.title p{margin:5px 0 0;color:var(--muted)}
    .summary{display:flex;gap:10px;flex-wrap:wrap}.chip{background:#fff;border:1px solid var(--line);padding:10px 14px;border-radius:999px;font-weight:700;box-shadow:0 4px 14px #173b6710}
    .tabs{display:flex;gap:8px;margin:14px 0 18px}.tab{border:0;border-radius:12px;padding:12px 18px;background:#dce9f6;color:var(--navy);font-weight:800}.tab.active{background:var(--navy);color:#fff}
    .toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.toolbar input{width:min(360px,100%);padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff}.ghost{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;color:var(--muted)}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 8px 24px #173b6712}.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.num{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--sky);color:var(--navy);font-weight:900}.name{flex:1}.name strong{display:block;font-size:19px}.name small{display:block;color:var(--muted);margin-top:3px;line-height:1.25}.score{font-size:36px;font-weight:900;color:var(--navy);min-width:50px;text-align:right}
    .controls{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:14px}.controls button{border:0;border-radius:10px;padding:10px 4px;font-weight:900}.plus{background:#e5f7eb;color:#187845}.minus{background:#ffe9e9;color:#a83137}
    .panel{display:none}.panel.active{display:block}.log{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}.log-row{display:grid;grid-template-columns:90px 1fr 90px;gap:10px;padding:12px 15px;border-bottom:1px solid var(--line)}.log-row:last-child{border:0}.delta{font-weight:900;text-align:right}.positive{color:var(--green)}.negative{color:var(--red)}.empty{padding:35px;text-align:center;color:var(--muted)}
    footer{margin-top:22px;text-align:center;color:var(--muted);font-size:13px}.danger{color:#a83137;border-color:#efc8ca}
    @media(max-width:650px){.app{padding:14px}header{align-items:flex-start;flex-direction:column}.toolbar{align-items:stretch;flex-direction:column}.tabs{overflow:auto}.log-row{grid-template-columns:65px 1fr 55px}.controls{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
<main class="app">
  <header><div class="title"><h1>4C 課堂加分站</h1><p>記錄每位同學的努力與進步</p></div><div class="summary"><span class="chip" id="classTotal">全班總分 0</span></div></header>
  <nav class="tabs" aria-label="版面切換"><button class="tab active" data-panel="students">個人加分</button><button class="tab" data-panel="ranking">排行榜</button><button class="tab" data-panel="history">變動紀錄</button></nav>
  <section class="panel active" id="students"><div class="toolbar"><input id="search" placeholder="搜尋學號、中文或英文姓名" aria-label="搜尋學生"><button class="ghost" id="sortStudent">按分數排序</button></div><div class="grid" id="studentGrid"></div></section>
  <section class="panel" id="ranking"><div class="grid" id="rankingGrid"></div></section>
  <section class="panel" id="history"><div class="toolbar"><strong>最近50次分數變動</strong><button class="ghost danger" id="reset">重設所有分數</button></div><div class="log" id="log"></div></section>
  <footer>分數會儲存在這部裝置的瀏覽器內。</footer>
</main>
<script>
const students=[
 [1,'陳玥瞳','CHAN YUET TUNG'],[2,'陳芊茵','CHENG CHIN YAN'],[3,'鄭仲軒','CHENG CHUNG HIN ALFRED'],[4,'霍學林','FAI HOK LAM HECTOR'],[5,'馮日楠','FUNG YAT NAM'],
 [6,'何健樂','HO KIN LOK'],[7,'許珮然','HUI PUI YIN'],[8,'熊子堯','HUNG TSZ YIU'],[9,'江梓欣','KONG TSZ YAN'],[10,'黎活游','LAI WOODY YAU'],
 [11,'林芊桐','LAM TSIN TUNG'],[12,'羅智亨','LAW CHI HANG'],[13,'梁梓熙','LEUNG TSZ HEI'],[14,'麥筠','MAK WAN MAUREEN'],[15,'孟宪岐','MENG XIANQI'],
 [16,'彭思瑋','PANG SZE WAI'],[17,'譚梓峰','TAM TSZ FUNG'],[18,'曾怡雅','TSANG YI NGA'],[19,'尹凱淳','WAN HOI SHUN'],[20,'黃晞珉','WONG HEI MAN'],
 [21,'黃栩柔','WONG HUI YAU CHARIS'],[22,'黃柏堯','WONG PAK YIU'],[23,'葉盈瑩','YE YING YING'],[24,'葉兆翔','YIP SIU CHEUNG'],[25,'葉梓皓','YIP TSZ HO'],[26,'張子桐','ZHANG SUKI']
].map(([no,zh,en])=>({no,zh,en}));
const key='4c-points-v1';
const savedState=JSON.parse(localStorage.getItem(key)||'null')||{};
let state={student:savedState.student||{},history:(savedState.history||[]).filter(x=>!/^第[一二三四五]組$/.test(x.label))}; let scoreSort=false;
const save=()=>{localStorage.setItem(key,JSON.stringify(state));render()};
const esc=s=>String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function change(type,id,delta,label){const bag=state[type];bag[id]=(bag[id]||0)+delta;state.history.unshift({time:new Date().toLocaleTimeString('zh-HK',{hour:'2-digit',minute:'2-digit'}),label,delta});state.history=state.history.slice(0,50);save()}
function renderStudents(){const q=document.querySelector('#search').value.trim().toLowerCase();let list=students.filter(s=>`${s.no} ${s.zh} ${s.en}`.toLowerCase().includes(q));if(scoreSort)list.sort((a,b)=>(state.student[b.no]||0)-(state.student[a.no]||0)||a.no-b.no);studentGrid.innerHTML=list.map(s=>`<article class="card"><div class="card-top"><span class="num">${s.no}</span><div class="name"><strong>${esc(s.zh)}</strong><small>${esc(s.en)}</small></div><span class="score">${state.student[s.no]||0}</span></div><div class="controls"><button class="plus" onclick="change('student',${s.no},1,'${esc(s.zh)}')">+1</button><button class="plus" onclick="change('student',${s.no},5,'${esc(s.zh)}')">+5</button><button class="minus" onclick="change('student',${s.no},-1,'${esc(s.zh)}')">−1</button><button class="minus" onclick="change('student',${s.no},-5,'${esc(s.zh)}')">−5</button></div></article>`).join('')}
function renderRanking(){const topStudents=[...students].sort((a,b)=>(state.student[b.no]||0)-(state.student[a.no]||0)||a.no-b.no).slice(0,10);rankingGrid.innerHTML=`<article class="card"><h2>個人龍虎榜</h2>${topStudents.map((s,i)=>`<div class="log-row"><b>${i+1}</b><span>${s.no}. ${esc(s.zh)}</span><b class="delta positive">${state.student[s.no]||0}</b></div>`).join('')}</article>`}
function renderLog(){log.innerHTML=state.history.length?state.history.map(x=>`<div class="log-row"><span>${x.time}</span><span>${esc(x.label)}</span><span class="delta ${x.delta>=0?'positive':'negative'}">${x.delta>=0?'+':''}${x.delta}</span></div>`).join(''):'<div class="empty">暫時未有分數變動</div>'}
function render(){renderStudents();renderRanking();renderLog();const total=Object.values(state.student).reduce((a,b)=>a+b,0);classTotal.textContent=`全班總分 ${total}`}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.panel).classList.add('active')});
search.oninput=renderStudents;sortStudent.onclick=()=>{scoreSort=!scoreSort;sortStudent.textContent=scoreSort?'按學號排序':'按分數排序';renderStudents()};
reset.onclick=()=>{if(confirm('確定要清除所有個人分數和紀錄嗎？')){state={student:{},history:[]};save()}};
render();
</script>
</body></html>
